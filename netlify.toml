[build]
command = "react-router build"
publish = "build/client"

[dev]
command = "react-router dev"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com; font-src 'self'; connect-src 'self' https://cloud.umami.is https://api-gateway.umami.dev"
